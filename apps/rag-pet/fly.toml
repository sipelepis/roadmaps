app = 'rag-pet'
primary_region = 'sin'

[build]

[env]
  PORT = '8080'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  # 'stop', not 'suspend': a resumed VM keeps its Postgres pool, whose connections
  # died while it slept, and every query then hangs on TCP retransmits for minutes.
  # A cold boot is a couple of seconds and starts with a fresh pool.
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = '10s'
    interval = '30s'
    method = 'GET'
    path = '/api/health'
    timeout = '5s'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
